<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" role="img" aria-labelledby="title desc">
  <title id="title">Meridian retail response routing logic</title><desc id="desc">An original study diagram showing how a customer question is read in context and routed to resolve, qualify, or escalate.</desc>
  <rect width="1600" height="740" fill="#f9fbfb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17323a"><text x="90" y="100" font-size="22" letter-spacing="4">MERIDIAN / ORIGINAL STUDY</text><text x="90" y="140" font-size="18">A routed-conversation concept. Not a client workflow or performance claim.</text></g>
  <g fill="none" stroke="#1f6f8b" stroke-width="4" stroke-linecap="round"><path d="M375 355 H525"/><path d="M715 355 H835 V220 H960"/><path d="M715 355 H960"/><path d="M715 355 H835 V490 H960"/></g><g fill="#1f6f8b"><path d="M525 355l-17-10v20z"/><path d="M960 220l-17-10v20z"/><path d="M960 355l-17-10v20z"/><path d="M960 490l-17-10v20z"/></g>
  <g font-family="Arial, Helvetica, sans-serif"><g transform="translate(90 270)"><rect width="285" height="170" rx="10" fill="#e8eef0" stroke="#17323a" stroke-width="4"/><text x="28" y="58" font-size="29" fill="#17323a" font-weight="700">CUSTOMER QUESTION</text><text x="28" y="101" font-size="18" fill="#17323a">history • need • urgency</text><text x="28" y="132" font-size="16" fill="#1f6f8b">CONTEXT STAYS ATTACHED</text></g><g transform="translate(525 255)"><path d="M95 0 L190 95 L95 190 L0 95 Z" fill="#fff" stroke="#1f6f8b" stroke-width="4"/><text x="95" y="83" text-anchor="middle" font-size="20" fill="#17323a" font-weight="700">READ</text><text x="95" y="110" text-anchor="middle" font-size="17" fill="#17323a">WHAT NEXT?</text></g><g transform="translate(960 125)"><rect width="300" height="135" rx="10" fill="#f9fbfb" stroke="#1f6f8b" stroke-width="4"/><text x="25" y="52" font-size="28" fill="#17323a" font-weight="700">RESOLVE</text><text x="25" y="91" font-size="18" fill="#17323a">routine need</text></g><g transform="translate(960 290)"><rect width="300" height="135" rx="10" fill="#f9fbfb" stroke="#1f6f8b" stroke-width="4"/><text x="25" y="52" font-size="28" fill="#17323a" font-weight="700">QUALIFY</text><text x="25" y="91" font-size="18" fill="#17323a">active conversation</text></g><g transform="translate(960 455)"><rect width="300" height="135" rx="10" fill="#b9ff16" stroke="#17323a" stroke-width="4"/><text x="25" y="52" font-size="28" fill="#17323a" font-weight="700">ESCALATE</text><text x="25" y="91" font-size="18" fill="#17323a">accountable owner</text></g></g>
  <text x="1300" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#17323a" text-anchor="end">Automation ends where responsibility begins.</text>
</svg>
