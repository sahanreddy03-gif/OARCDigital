<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">PJAZZA illustrative marketplace journey</title><desc id="desc">A four-step loop from discover, watch, ask, and decide. This is an illustrative product journey with no outcome claims.</desc>
  <rect width="1600" height="700" fill="#fff9f4"/>
  <g fill="none" stroke="#2c2430" stroke-width="3" stroke-linecap="round"><path d="M340 325 C390 325 405 325 455 325"/><path d="M700 325 C750 325 765 325 815 325"/><path d="M1060 325 C1110 325 1125 325 1175 325"/><path d="M1320 470 C1110 610 570 610 280 470" stroke-dasharray="10 14"/></g>
  <g fill="#2c2430"><path d="M455 325l-17-10v20z"/><path d="M815 325l-17-10v20z"/><path d="M1175 325l-17-10v20z"/></g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#2c2430"><text x="86" y="104" font-size="22" letter-spacing="4">PJAZZA / ILLUSTRATIVE PRODUCT JOURNEY</text><text x="86" y="142" font-size="18">Watch, ask and decide closer together — no outcome claim.</text></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(95 235)"><rect width="245" height="180" rx="10" fill="#fff1e9" stroke="#e7674c" stroke-width="4"/><text x="26" y="55" font-size="18" fill="#e7674c" font-weight="700">01</text><text x="26" y="102" font-size="36" fill="#2c2430" font-weight="700">DISCOVER</text><text x="26" y="136" font-size="18" fill="#2c2430">A relevant local offer</text></g>
    <g transform="translate(455 235)"><rect width="245" height="180" rx="10" fill="#f7e3d8" stroke="#e7674c" stroke-width="4"/><text x="26" y="55" font-size="18" fill="#e7674c" font-weight="700">02</text><text x="26" y="102" font-size="36" fill="#2c2430" font-weight="700">WATCH</text><text x="26" y="136" font-size="18" fill="#2c2430">Live context adds detail</text></g>
    <g transform="translate(815 235)"><rect width="245" height="180" rx="10" fill="#fffaf4" stroke="#2c2430" stroke-width="4"/><text x="26" y="55" font-size="18" fill="#e7674c" font-weight="700">03</text><text x="26" y="102" font-size="36" fill="#2c2430" font-weight="700">ASK</text><text x="26" y="136" font-size="18" fill="#2c2430">A seller answers in context</text></g>
    <g transform="translate(1175 235)"><rect width="245" height="180" rx="10" fill="#c9ff2b" stroke="#2c2430" stroke-width="4"/><text x="26" y="55" font-size="18" fill="#2c2430" font-weight="700">04</text><text x="26" y="102" font-size="36" fill="#2c2430" font-weight="700">DECIDE</text><text x="26" y="136" font-size="18" fill="#2c2430">A clearer next step</text></g>
  </g>
  <text x="800" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2c2430">RETURN / RECOMMEND</text>
</svg>
