<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Skyline First Response illustrative human handoff</title><desc id="desc">An original property-experience concept showing a question moving from ask to understand, prepare, and a human agent conversation.</desc>
  <rect width="1600" height="700" fill="#fffdf8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f3b54"><text x="85" y="96" font-size="22" letter-spacing="4">SKYLINE / ORIGINAL STUDY</text><text x="85" y="136" font-size="18">Preparation for a human agent conversation — no property listing or conversion claim.</text></g>
  <path d="M340 350 C390 220 470 220 530 350 S690 480 750 350 S910 220 970 350 S1130 480 1190 350" fill="none" stroke="#4498ca" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif"><g transform="translate(90 270)"><rect width="250" height="165" rx="10" fill="#fff2df" stroke="#1f3b54" stroke-width="4"/><text x="26" y="54" font-size="18" fill="#ff7452" font-weight="700">01</text><text x="26" y="102" font-size="33" fill="#1f3b54" font-weight="700">ASK</text><text x="26" y="136" font-size="17" fill="#1f3b54">A partial property question</text></g><g transform="translate(485 270)"><rect width="250" height="165" rx="10" fill="#fffdf8" stroke="#4498ca" stroke-width="4"/><text x="26" y="54" font-size="18" fill="#4498ca" font-weight="700">02</text><text x="26" y="102" font-size="28" fill="#1f3b54" font-weight="700">UNDERSTAND</text><text x="26" y="136" font-size="17" fill="#1f3b54">timing • place • purpose</text></g><g transform="translate(880 270)"><rect width="250" height="165" rx="10" fill="#fffdf8" stroke="#4498ca" stroke-width="4"/><text x="26" y="54" font-size="18" fill="#4498ca" font-weight="700">03</text><text x="26" y="102" font-size="28" fill="#1f3b54" font-weight="700">PREPARE</text><text x="26" y="136" font-size="17" fill="#1f3b54">a readable next-step brief</text></g><g transform="translate(1275 270)"><rect width="250" height="165" rx="10" fill="#ff7452" stroke="#1f3b54" stroke-width="4"/><text x="26" y="54" font-size="18" fill="#fff" font-weight="700">04</text><text x="26" y="102" font-size="30" fill="#fff" font-weight="700">MEET</text><text x="26" y="136" font-size="17" fill="#fff">a human conversation</text></g></g>
  <text x="800" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f3b54">PREPARE, DO NOT REPLACE</text>
</svg>
