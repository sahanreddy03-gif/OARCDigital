<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="Diagram: before the work MCW sat low in local search results; after three months it sat first">
  <rect width="1000" height="800" fill="#10251f"/>

  <text x="70" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.6" fill="#7f9a8e">WHERE MCW SAT IN LOCAL SEARCH</text>

  <g>
    <text x="70" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#7f9a8e">BEFORE</text>
    <rect x="70" y="180" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="70" y="232" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="70" y="284" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="70" y="336" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="70" y="388" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="70" y="440" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="70" y="492" width="360" height="40" rx="4" fill="#2b4d42"/>
    <text x="86" y="518" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#9db5aa">MCW</text>
    <rect x="70" y="544" width="360" height="40" rx="4" fill="#1d3a31"/>
  </g>

  <g>
    <path d="M466 380 L516 380 M500 366 L516 380 L500 394" stroke="#f4b942" stroke-width="3" fill="none" stroke-linecap="square"/>
    <text x="452" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#7f9a8e">3 MONTHS</text>
  </g>

  <g>
    <text x="570" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#f4b942">AFTER</text>
    <rect x="570" y="180" width="360" height="52" rx="4" fill="#f4b942"/>
    <text x="588" y="213" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#10251f">MCW</text>
    <text x="892" y="213" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#10251f">#1</text>
    <rect x="570" y="244" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="570" y="296" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="570" y="348" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="570" y="400" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="570" y="452" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="570" y="504" width="360" height="40" rx="4" fill="#1d3a31"/>
    <rect x="570" y="556" width="360" height="40" rx="4" fill="#1d3a31"/>
  </g>

  <line x1="70" y1="648" x2="930" y2="648" stroke="#2b4d42" stroke-width="1"/>
  <text x="70" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#fffdf8">&#8364;20,000 in sales.</text>
  <text x="70" y="736" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7f9a8e">Sales grew 30% month on month.</text>
  <text x="70" y="772" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d7a6e">Diagram by OARC Digital. Positions shown are illustrative of the ranking change, not a screenshot.</text>
</svg>
