<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1100" role="img" aria-labelledby="title desc">
  <title id="title">Northforge adoption ladder</title><desc id="desc">An original framework with four accountable steps: choose, own, practice, and review.</desc>
  <rect width="1100" height="1100" fill="#1d2928"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="75" y="92" font-size="20" letter-spacing="4" fill="#e9eceb">NORTHFORGE / ORIGINAL STUDY</text><text x="75" y="130" font-size="17" fill="#e9eceb">An accountable AI operating-model framework. No enterprise deployment claim.</text></g>
  <g fill="none" stroke="#c9ff2b" stroke-width="4"><path d="M550 880V770"/><path d="M550 635V525"/><path d="M550 390V280"/><path d="M602 280l-52-65-52 65"/></g>
  <g font-family="Arial, Helvetica, sans-serif"><g transform="translate(235 770)"><rect width="630" height="110" rx="10" fill="#f6f7f6"/><text x="35" y="47" font-size="19" fill="#1d2928" font-weight="700">01 / CHOOSE</text><text x="35" y="84" font-size="27" fill="#1d2928">A bounded operating need</text></g><g transform="translate(235 525)"><rect width="630" height="110" rx="10" fill="#e9eceb"/><text x="35" y="47" font-size="19" fill="#1d2928" font-weight="700">02 / OWN</text><text x="35" y="84" font-size="27" fill="#1d2928">Name a responsible person</text></g><g transform="translate(235 280)"><rect width="630" height="110" rx="10" fill="#c9ff2b"/><text x="35" y="47" font-size="19" fill="#1d2928" font-weight="700">03 / PRACTICE</text><text x="35" y="84" font-size="27" fill="#1d2928">Use it in real work</text></g><g transform="translate(235 35)"><rect width="630" height="110" rx="10" fill="#e9eceb"/><text x="35" y="47" font-size="19" fill="#1d2928" font-weight="700">04 / REVIEW</text><text x="35" y="84" font-size="27" fill="#1d2928">Inspect exceptions and change</text></g></g>
  <text x="550" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e9eceb">ONE RESPONSIBLE RUNG AT A TIME</text>
</svg>
