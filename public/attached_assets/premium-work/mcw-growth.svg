<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Bar chart: sales grew thirty per cent in month two and again in month three">
  <rect width="900" height="300" fill="none"/>

  <line x1="0" y1="236" x2="900" y2="236" stroke="#3a3b36" stroke-width="2"/>

  <rect x="0" y="176" width="268" height="60" fill="#4a4c46"/>
  <text x="0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9a9c95">Month 1</text>

  <rect x="316" y="138" width="268" height="98" fill="#86887f"/>
  <text x="316" y="272" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9a9c95">Month 2</text>
  <text x="316" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#fffdf8">+30%</text>

  <rect x="632" y="86" width="268" height="150" fill="#f4b942"/>
  <text x="632" y="272" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9a9c95">Month 3</text>
  <text x="632" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#fffdf8">+30%</text>
</svg>
