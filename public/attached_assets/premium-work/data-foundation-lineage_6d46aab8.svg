<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Data Foundation illustrative lineage</title><desc id="desc">An anonymised system pattern showing data from ERP, CRM and legacy sources moving through audit, standardisation and exception validation.</desc>
  <rect width="1600" height="720" fill="#fdfcf9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1d3239"><text x="92" y="96" font-size="22" letter-spacing="4">DATA FOUNDATION / ANONYMISED INTERVENTION PATTERN</text><text x="92" y="135" font-size="18">Illustrative source lineage. No client data, performance figures, or identity.</text></g>
  <g fill="none" stroke="#3a6976" stroke-width="4" stroke-linecap="round"><path d="M370 215 H600"/><path d="M370 360 H600"/><path d="M370 505 H600"/><path d="M820 360 H1005"/><path d="M1235 360 H1370"/></g><g fill="#3a6976"><path d="M600 215l-17-10v20z"/><path d="M600 360l-17-10v20z"/><path d="M600 505l-17-10v20z"/><path d="M1005 360l-17-10v20z"/><path d="M1370 360l-17-10v20z"/></g>
  <g font-family="Arial, Helvetica, sans-serif"><g transform="translate(95 150)"><ellipse cx="135" cy="35" rx="135" ry="35" fill="#eaf0f2" stroke="#1d3239" stroke-width="4"/><path d="M0 35v92c0 19 270 19 270 0V35" fill="#eaf0f2" stroke="#1d3239" stroke-width="4"/><text x="135" y="84" text-anchor="middle" font-size="28" font-weight="700" fill="#1d3239">ERP</text><text x="135" y="115" text-anchor="middle" font-size="16" fill="#1d3239">conflicting identifiers</text></g><g transform="translate(95 295)"><ellipse cx="135" cy="35" rx="135" ry="35" fill="#eaf0f2" stroke="#1d3239" stroke-width="4"/><path d="M0 35v92c0 19 270 19 270 0V35" fill="#eaf0f2" stroke="#1d3239" stroke-width="4"/><text x="135" y="84" text-anchor="middle" font-size="28" font-weight="700" fill="#1d3239">CRM</text><text x="135" y="115" text-anchor="middle" font-size="16" fill="#1d3239">partial customer record</text></g><g transform="translate(95 440)"><ellipse cx="135" cy="35" rx="135" ry="35" fill="#eaf0f2" stroke="#1d3239" stroke-width="4"/><path d="M0 35v92c0 19 270 19 270 0V35" fill="#eaf0f2" stroke="#1d3239" stroke-width="4"/><text x="135" y="84" text-anchor="middle" font-size="25" font-weight="700" fill="#1d3239">LEGACY</text><text x="135" y="115" text-anchor="middle" font-size="16" fill="#1d3239">inconsistent formats</text></g><g transform="translate(600 255)"><path d="M115 0 L230 65 L230 195 L115 260 L0 195 L0 65 Z" fill="#fff" stroke="#3a6976" stroke-width="4"/><text x="115" y="112" text-anchor="middle" font-size="31" font-weight="700" fill="#1d3239">AUDIT</text><text x="115" y="144" text-anchor="middle" font-size="17" fill="#1d3239">map conflicts</text></g><g transform="translate(1005 290)"><rect width="230" height="140" rx="10" fill="#fff" stroke="#3a6976" stroke-width="4"/><text x="24" y="58" font-size="24" fill="#1d3239" font-weight="700">STANDARDISE</text><text x="24" y="96" font-size="17" fill="#1d3239">make comparable</text></g><g transform="translate(1370 290)"><rect width="185" height="140" rx="10" fill="#c9ff2b" stroke="#1d3239" stroke-width="4"/><text x="22" y="58" font-size="24" fill="#1d3239" font-weight="700">VALIDATE</text><text x="22" y="96" font-size="17" fill="#1d3239">review exceptions</text></g></g>
</svg>
